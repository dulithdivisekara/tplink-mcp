[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tplink-mcp"
version = "1.0.0"
description = "Universal, Agent-Safe Model Context Protocol (MCP) Server for TP-Link Routers"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dulith Divisekara", email = "dulithdivisekara@gmail.com" }
]
keywords = [
    "mcp", "model-context-protocol", "tplink", "router-mcp", "agentic-ai", "claude-desktop", "antigravity", "archer-mr200"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "cryptography>=38.0.0",
    "pycryptodome>=3.18.0",
    "tplinkrouterc6u>=5.30.0",
]

[project.scripts]
tplink-mcp = "tplink_mcp.server:main"

[project.urls]
Homepage = "https://github.com/dulithdivisekara/tplink-mcp"
Repository = "https://github.com/dulithdivisekara/tplink-mcp.git"
Issues = "https://github.com/dulithdivisekara/tplink-mcp/issues"
